name: Send TG-report about total group volume

on:
   push:
      paths:
         - 'mailing/ConsultantTreeMLM_JULIA.xml'
   workflow_dispatch:

jobs:
  build-contacts-list:
    runs-on: ubuntu-latest
    outputs:
      # Прокидываем output шага на уровень всей джобы
      file_name: ${{ steps.set-vars.outputs.file_name }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Активирует Node.js 24 для всех JS-действий в этом задании    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Install xsltproc and jq
        run: |
          sudo apt-get update   
          sudo apt-get install -y xsltproc jq
          
      - name: Set Variables
        id: set-vars
        run: |
          echo "file_name=group_volume_for_period.json" >> $GITHUB_OUTPUT

      - name: Transform XML to JSON
        run: |
          # Запускаем трансформацию
          xsltproc mailing/contacts_result_ConsultantTreeMLM.xsl mailing/ConsultantTreeMLM_JULIA.xml > ${{ steps.set-vars.outputs.file_name }}
          # Считаем элементы и выводим в консоль
          COUNT=$(jq '. | length' ${{ steps.set-vars.outputs.file_name }})
          echo "Количество элементов в файле: $COUNT"
          # Вывод результата в лог для проверки
          # cat ${{ steps.set-vars.outputs.file_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mail-contacts
          path: ${{ steps.set-vars.outputs.file_name }}
          
  send-tg-report:
    needs: [build-contacts-list]
    # Запускаем, если файл был найден, даже если рассылка (email) не требуется
    if: needs.build-contacts-list.outputs.file_name != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download result
        uses: actions/download-artifact@v4
        with:
          name: mail-contacts

      - name: Generate Summary Report
        id: report
        run: |
          FILE="${{ needs.build-contacts-list.outputs.file_name }}"
          
          # 1. Общее количество
          TOTAL=$(jq '. | length' $FILE)
          
          # 2. Сводная таблица по наставникам
          TABLE=$(jq -r '
              # 1. Индексация данных
              (reduce .[] as $item ({}; 
                if ($item | type) == "object" then
                  .pv[$item.name] = ($item.pv | tonumber? // 0) |
                  .my_tutor[$item.name] = $item.tutor_name | # Запоминаем, кто наставник этого человека
                  if $item.tutor_name then .tree[$item.tutor_name] += [$item.name] else . end
                else . end
              )) as $data |
            
              # 2. Функция с лимитом глубины
              def sum_pv($name; $depth):
                if $depth <= 0 then 0
                else
                  ($data.pv[$name] // 0) + 
                  ([ $data.tree[$name][]? | sum_pv(.; $depth - 1) ] | add // 0)
                end;
            
              # 3. Формируем список ТОР-наставников (тех, у кого самих НЕТ наставника в этом списке)
              [ $data.tree | keys_unsorted[] | select(. != null and . != "") ]
            
              | map(select($data.my_tutor[.] == null or $data.my_tutor[.] == ""))
              
              | map({
                  tutor: .,
                  total_pv_3_levels: (sum_pv(.; 4) * 100 | round / 100)
                })
            
              | sort_by(.total_pv_3_levels) | reverse
              | . as $items
               ($items[] 
              | (.tutor | split(" ") | .[0] + " " + .[1]) as $short_tutor 
              | "\($short_tutor): \t\(.total_pv_3_levels)"),
            "ИТОГО: \t\( [ $items[].total_pv_3_levels ] | add )"
            ' $FILE | column -s $'\t' -t )

          # Формируем параметры для текста в Telegram
          # Безопасная запись многострочного вывода
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "table<<EOF" >> $GITHUB_OUTPUT
          echo "${TABLE:-Нет данных по наставникам}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            **Количество консультантов с баллами: ${{ steps.report.outputs.total }} **
            📊 **Распределение баллов по группам:**
            ${{ steps.report.outputs.table }}
  

